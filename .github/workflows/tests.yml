name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

jobs:
  integration_tests:
    # Will not run if the event is a PR to bump-meilisearch-v* (so a pre-release PR)
    # Will still run for each push to bump-meilisearch-v*
    if: github.event_name != 'pull_request' || !startsWith(github.base_ref, 'bump-meilisearch-v')
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Meilisearch (latest version) setup with Docker
        env:
          # Any docker tag is actually accepted as a valid version
          MEILISEARCH_VERSION: latest
        run: docker compose up -d
      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

  aot_smoke:
    name: native-aot-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish Native AOT binaries
        run: |
          dotnet publish tests/Meilisearch.AotSmoke -c Release -r linux-x64 -f net8.0 -o artifacts/aot-smoke/net8.0
          dotnet publish tests/Meilisearch.AotSmoke -c Release -r linux-x64 -f net10.0 -o artifacts/aot-smoke/net10.0
      - name: Meilisearch (latest version) setup with Docker
        env:
          MEILISEARCH_VERSION: latest
        run: docker compose up -d meilisearch
      - name: Run smoke scenario (.NET 8)
        run: ./artifacts/aot-smoke/net8.0/Meilisearch.AotSmoke
      - name: Run smoke scenario (.NET 10)
        run: ./artifacts/aot-smoke/net10.0/Meilisearch.AotSmoke

  format:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Check with dotnet-format
        run: dotnet format --version
      - name: Check with dotnet-format
        run: dotnet format --verbosity normal --verify-no-changes

  yaml-lint:
    name: Yaml linting check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Yaml lint check
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
